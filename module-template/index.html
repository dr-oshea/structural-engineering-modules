<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Module</title>

  <link rel="stylesheet" href="../core/style.css">

  <!-- ═══ KaTeX — LaTeX maths rendering (optional but recommended) ═══
       Lets you write \[ … \] or $ … $ anywhere in a module's content.
       If these three lines are removed (or the CDN is unreachable), modules
       still work — raw LaTeX simply shows as plain text.
       `defer` scripts run before DOMContentLoaded, which is when the engine
       boots, so KaTeX is always ready in time.                              -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css"
        integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1"
        crossorigin="anonymous">
  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"
          integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7"
          crossorigin="anonymous"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js"
          integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
          crossorigin="anonymous"></script>
</head>

<body>

  <div id="app"></div>

  <!-- ═══ LOAD ORDER MATTERS ═══
       0. tracking  — optional; harmless when BACKEND_URL is empty
       1. engine.js — the framework and registerSlideType()
       2. types/*   — each content type registers itself
       3. config.js — this module's content (moduleData)
       Rendering starts automatically once everything has loaded.            -->

  <!-- 0. Tracking (optional) -->
  <script src="../core/context.js"></script>
  <script src="../core/api.js"></script>

  <!-- 1. The engine -->
  <script src="../core/engine.js"></script>

  <!-- 2. Content types -->
  <script src="../core/types/splash.js"></script>
  <script src="../core/types/context.js"></script>
  <script src="../core/types/info.js"></script>
  <script src="../core/types/pptslide.js"></script>
  <script src="../core/types/cards.js"></script>
  <script src="../core/types/steps.js"></script>
  <script src="../core/types/mcq.js"></script>
  <script src="../core/types/hotspot.js"></script>
  <script src="../core/types/explore.js"></script>
  <script src="../core/types/interactive-diagram.js"></script>
  <script src="../core/types/diagram-plot.js"></script>
  <script src="../core/types/explore.js"></script>
  <script src="../core/types/embed.js"></script>
  <script src="../core/types/reveal.js"></script>
  <script src="../core/types/quiz.js"></script>
  <script src="../core/types/final.js"></script>

  <!-- 3. This module's content -->
  <script src="config.js"></script>

</body>
</html>
