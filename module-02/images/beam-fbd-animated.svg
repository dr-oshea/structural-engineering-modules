<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animation: isolating the free body of a beam</title>
<desc>The animation begins with a beam pin-supported at its left end and suspended by a rope at its right end. The supports then fade away and are replaced by reaction force vectors: a vertical upward force at the rope, and a vertical upward plus horizontal rightward force at the pin.</desc>

<defs>
  <linearGradient id="beamGrey" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#6E7A85"/>
    <stop offset="20%"  stop-color="#A8B4BE"/>
    <stop offset="45%"  stop-color="#E2E8ED"/>
    <stop offset="60%"  stop-color="#C3CDD5"/>
    <stop offset="100%" stop-color="#7C8892"/>
  </linearGradient>

  <style>
    #supports  { animation: suppFade 10s ease-in-out infinite; }
    #halo      { animation: haloIn  10s ease-in-out infinite; opacity: 0; }
    #brighten  { animation: brightIn 10s ease-in-out infinite; opacity: 0; }
    #beam      { animation: beamEdge 10s ease-in-out infinite; }
    .vec-up    { animation: vecUp   10s ease-in-out infinite; opacity: 0; }
    .vec-right { animation: vecRight 10s ease-in-out infinite; opacity: 0; }

    @keyframes suppFade {
      0%, 18%   { opacity: 1; }
      30%, 86%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes haloIn {
      0%, 18%   { opacity: 0; }
      30%, 86%  { opacity: 0.38; }
      100%      { opacity: 0; }
    }
    @keyframes brightIn {
      0%, 18%   { opacity: 0; }
      30%, 86%  { opacity: 0.22; }
      100%      { opacity: 0; }
    }
    @keyframes beamEdge {
      0%, 18%   { stroke-width: 1.5; }
      30%, 86%  { stroke-width: 2.6; }
      100%      { stroke-width: 1.5; }
    }
    @keyframes vecUp {
      0%, 30%   { opacity: 0; transform: translateY(14px); }
      44%, 86%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; transform: translateY(14px); }
    }
    @keyframes vecRight {
      0%, 30%   { opacity: 0; transform: translateX(-14px); }
      44%, 86%  { opacity: 1; transform: translateX(0); }
      100%      { opacity: 0; transform: translateX(-14px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #supports, #halo, #brighten, #beam, .vec-up, .vec-right { animation: none; }
      #supports { opacity: 1; }
    }
  </style>
</defs>

<rect width="680" height="360" fill="#FFFFFF"/>

<g id="supports">
  <line x1="490" y1="90" x2="590" y2="90" stroke="#2B2B2B" stroke-width="3"/>
  <g stroke="#2B2B2B" stroke-width="1.2" stroke-linecap="round">
    <line x1="502" y1="90" x2="490" y2="78"/>
    <line x1="514" y1="90" x2="502" y2="78"/>
    <line x1="526" y1="90" x2="514" y2="78"/>
    <line x1="538" y1="90" x2="526" y2="78"/>
    <line x1="550" y1="90" x2="538" y2="78"/>
    <line x1="562" y1="90" x2="550" y2="78"/>
    <line x1="574" y1="90" x2="562" y2="78"/>
    <line x1="586" y1="90" x2="574" y2="78"/>
  </g>
  <line x1="540" y1="90" x2="540" y2="250" stroke="#2B2B2B" stroke-width="1.6"/>
  <circle cx="540" cy="90" r="4.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8"/>
  <circle cx="540" cy="250" r="4.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8"/>
  <polygon points="150,276 124,318 176,318" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="114" y1="318" x2="186" y2="318" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#2B2B2B" stroke-width="1.2" stroke-linecap="round">
    <line x1="124" y1="318" x2="114" y2="328"/>
    <line x1="134" y1="318" x2="124" y2="328"/>
    <line x1="144" y1="318" x2="134" y2="328"/>
    <line x1="154" y1="318" x2="144" y2="328"/>
    <line x1="164" y1="318" x2="154" y2="328"/>
    <line x1="174" y1="318" x2="164" y2="328"/>
    <line x1="184" y1="318" x2="174" y2="328"/>
  </g>
</g>

<rect id="halo" x="142" y="242" width="406" height="42" rx="5" fill="none" stroke="#1B6CA8" stroke-width="2"/>

<rect id="beam" x="150" y="250" width="390" height="26" fill="url(#beamGrey)" stroke="#1A1A1A" stroke-width="1.5"/>
<rect id="brighten" x="150" y="250" width="390" height="26" fill="#FFFFFF"/>

<g class="vec-up">
  <line x1="540" y1="250" x2="540" y2="192" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="540,172 531,192 549,192" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>

<g class="vec-up">
  <line x1="150" y1="342" x2="150" y2="298" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="150,278 141,298 159,298" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>

<g class="vec-right">
  <line x1="74" y1="263" x2="126" y2="263" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="146,263 126,254 126,272" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>
</svg>
