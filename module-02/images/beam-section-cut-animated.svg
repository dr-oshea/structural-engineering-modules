<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Animation: section cut through the beam and rope</title>
<desc>The animation begins with a beam pin-supported at its left end and hung from a rope at its right end. A dashed rectangular region appears, cutting through both the beam and the rope. Everything outside the region fades away, and internal actions appear at the cut faces: axial force pointing left, shear force pointing up, and a clockwise moment at the beam cut, plus an upward force at the rope cut.</desc>

<defs>
  <linearGradient id="beamGrey" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#6E7A85"/>
    <stop offset="20%"  stop-color="#A8B4BE"/>
    <stop offset="45%"  stop-color="#E2E8ED"/>
    <stop offset="60%"  stop-color="#C3CDD5"/>
    <stop offset="100%" stop-color="#7C8892"/>
  </linearGradient>

  <style>
    #outside   { animation: outsideOut 12s ease-in-out infinite; }
    #region    { animation: regionIn   12s ease-in-out infinite; opacity: 0; }
    #keptEdge  { animation: keptIn     12s ease-in-out infinite; opacity: 0; }
    .act-left  { animation: actLeft    12s ease-in-out infinite; opacity: 0; }
    .act-up    { animation: actUp      12s ease-in-out infinite; opacity: 0; }
    .act-plain { animation: actPlain   12s ease-in-out infinite; opacity: 0; }

    @keyframes outsideOut {
      0%, 24%  { opacity: 1; }
      38%, 88% { opacity: 0; }
      100%     { opacity: 1; }
    }
    @keyframes regionIn {
      0%, 12%  { opacity: 0; }
      24%, 38% { opacity: 1; }
      52%, 88% { opacity: 0.28; }
      100%     { opacity: 0; }
    }
    @keyframes keptIn {
      0%, 24%  { opacity: 0; }
      38%, 88% { opacity: 1; }
      100%     { opacity: 0; }
    }
    @keyframes actLeft {
      0%, 38%  { opacity: 0; transform: translateX(14px); }
      54%, 88% { opacity: 1; transform: translateX(0); }
      100%     { opacity: 0; transform: translateX(14px); }
    }
    @keyframes actUp {
      0%, 38%  { opacity: 0; transform: translateY(14px); }
      54%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(14px); }
    }
    @keyframes actPlain {
      0%, 38%  { opacity: 0; }
      54%, 88% { opacity: 1; }
      100%     { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #outside, #region, #keptEdge, .act-left, .act-up, .act-plain { animation: none; }
      #outside { opacity: 1; }
    }
  </style>
</defs>

<rect width="680" height="360" fill="#FFFFFF"/>

<rect x="380" y="250" width="160" height="26" fill="url(#beamGrey)"/>

<g id="outside">
  <line x1="490" y1="90" x2="590" y2="90" stroke="#2B2B2B" stroke-width="3"/>
  <g stroke="#2B2B2B" stroke-width="1.2" stroke-linecap="round">
    <line x1="502" y1="90" x2="490" y2="78"/><line x1="514" y1="90" x2="502" y2="78"/>
    <line x1="526" y1="90" x2="514" y2="78"/><line x1="538" y1="90" x2="526" y2="78"/>
    <line x1="550" y1="90" x2="538" y2="78"/><line x1="562" y1="90" x2="550" y2="78"/>
    <line x1="574" y1="90" x2="562" y2="78"/><line x1="586" y1="90" x2="574" y2="78"/>
  </g>
  <line x1="540" y1="90" x2="540" y2="250" stroke="#2B2B2B" stroke-width="1.6"/>
  <circle cx="540" cy="90" r="4.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8"/>
  <rect x="150" y="250" width="390" height="26" fill="url(#beamGrey)" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="150,276 124,318 176,318" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="114" y1="318" x2="186" y2="318" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#2B2B2B" stroke-width="1.2" stroke-linecap="round">
    <line x1="124" y1="318" x2="114" y2="328"/><line x1="134" y1="318" x2="124" y2="328"/>
    <line x1="144" y1="318" x2="134" y2="328"/><line x1="154" y1="318" x2="144" y2="328"/>
    <line x1="164" y1="318" x2="154" y2="328"/><line x1="174" y1="318" x2="164" y2="328"/>
    <line x1="184" y1="318" x2="174" y2="328"/>
  </g>
</g>

<line x1="540" y1="160" x2="540" y2="250" stroke="#2B2B2B" stroke-width="1.6"/>
<circle cx="540" cy="250" r="4.5" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.8"/>

<g id="keptEdge">
  <rect x="380" y="250" width="160" height="26" fill="none" stroke="#1A1A1A" stroke-width="2"/>
</g>

<rect id="region" x="380" y="160" width="200" height="150" fill="none"
      stroke="#555555" stroke-width="1.6" stroke-dasharray="7,5" rx="3"/>

<g class="act-left">
  <line x1="380" y1="263" x2="316" y2="263" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="296,263 316,254 316,272" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>

<g class="act-up">
  <line x1="380" y1="263" x2="380" y2="205" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="380,185 371,205 389,205" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>

<g class="act-plain">
  <path d="M421,292 A50,50 0 0 1 342,297" fill="none" stroke="#1B6CA8" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="332,282 350,292 335,302" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>

<g class="act-up">
  <line x1="540" y1="160" x2="540" y2="122" stroke="#1B6CA8" stroke-width="2.6"/>
  <polygon points="540,102 531,122 549,122" fill="#FFFFFF" stroke="#1B6CA8" stroke-width="1.8" stroke-linejoin="round"/>
</g>
</svg>
