<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 560"
     width="1200" height="560"
     role="img"
     aria-label="Two structural members separate at an internal hinge to reveal equal and opposite force components">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebdca"/>
      <stop offset="0.48" stop-color="#7f96aa"/>
      <stop offset="1" stop-color="#667d91"/>
    </linearGradient>
    <linearGradient id="steelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5edf3"/>
      <stop offset="0.45" stop-color="#9dafbd"/>
      <stop offset="1" stop-color="#526879"/>
    </linearGradient>
    <radialGradient id="pinOuter" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#edf3f7"/>
      <stop offset="0.46" stop-color="#a9b8c4"/>
      <stop offset="1" stop-color="#64798a"/>
    </radialGradient>
    <radialGradient id="pinInner" cx="34%" cy="30%" r="72%">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="0.5" stop-color="#c7d1d9"/>
      <stop offset="1" stop-color="#879aa8"/>
    </radialGradient>
    <filter id="memberShadow" x="-25%" y="-40%" width="150%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#243746" flood-opacity="0.18"/>
    </filter>
    <filter id="pinShadow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#243746" flood-opacity="0.26"/>
    </filter>
    <filter id="arrowGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#b91c1c" flood-opacity="0.22"/>
    </filter>

    <mask id="leftMemberMask" maskUnits="userSpaceOnUse" x="-820" y="-80" width="900" height="160">
      <rect x="-800" y="-52" width="840" height="104" rx="52" fill="white"/>
      <circle cx="0" cy="0" r="20" fill="black"/>
    </mask>
    <mask id="rightMemberMask" maskUnits="userSpaceOnUse" x="-80" y="-80" width="900" height="160">
      <rect x="-40" y="-52" width="840" height="104" rx="52" fill="white"/>
      <circle cx="0" cy="0" r="20" fill="black"/>
    </mask>

    <marker id="forceArrow" markerWidth="24" markerHeight="24" refX="20" refY="10" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 20">
      <path d="M 0 0 L 20 10 L 0 20 Z" fill="#ef2b2d"/>
    </marker>
  </defs>

  <!-- A transparent background is intentional, so the animation can sit on any webpage. -->
  <ellipse cx="600" cy="425" rx="365" ry="27" fill="#263947" opacity="0.07">
    <animate attributeName="rx" dur="8s" repeatCount="indefinite"
             values="365;365;430;430;365;365"
             keyTimes="0;0.18;0.38;0.72;0.94;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
             values="0.07;0.07;0.045;0.045;0.07;0.07"
             keyTimes="0;0.18;0.38;0.72;0.94;1"/>
  </ellipse>

  <!-- Right member -->
  <g id="rightMemberMove">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0 0;0 0;150 0;150 0;0 0;0 0"
      keyTimes="0;0.18;0.38;0.72;0.94;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <g transform="translate(600 320) rotate(-24)" filter="url(#memberShadow)">
      <g mask="url(#rightMemberMask)">
        <rect x="-40" y="-52" width="840" height="104" rx="52" fill="url(#steel)"/>
        <rect x="-40" y="-52" width="840" height="104" rx="52" fill="none" stroke="#344b5d" stroke-width="5"/>
        <path d="M 8 -31 H 720" fill="none" stroke="#edf3f7" stroke-width="5" stroke-linecap="round" opacity="0.52"/>
        <path d="M 8 35 H 720" fill="none" stroke="#40586a" stroke-width="6" stroke-linecap="round" opacity="0.32"/>
      </g>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#344b5d" stroke-width="6"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#dfe7ed" stroke-width="2" opacity="0.65"/>
    </g>
  </g>

  <!-- Left member -->
  <g id="leftMemberMove">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0 0;0 0;-150 0;-150 0;0 0;0 0"
      keyTimes="0;0.18;0.38;0.72;0.94;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <g transform="translate(600 320) rotate(24)" filter="url(#memberShadow)">
      <g mask="url(#leftMemberMask)">
        <rect x="-800" y="-52" width="840" height="104" rx="52" fill="url(#steel)"/>
        <rect x="-800" y="-52" width="840" height="104" rx="52" fill="none" stroke="#344b5d" stroke-width="5"/>
        <path d="M -720 -31 H -8" fill="none" stroke="#edf3f7" stroke-width="5" stroke-linecap="round" opacity="0.52"/>
        <path d="M -720 35 H -8" fill="none" stroke="#40586a" stroke-width="6" stroke-linecap="round" opacity="0.32"/>
      </g>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#344b5d" stroke-width="6"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#dfe7ed" stroke-width="2" opacity="0.65"/>
    </g>
  </g>

  <!-- Hinge pin, removed before the members separate -->
  <g transform="translate(600 320)">
    <g id="hingePin" filter="url(#pinShadow)">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="1;1;0;0;1;1"
               keyTimes="0;0.145;0.235;0.82;0.92;1"/>
      <animateTransform attributeName="transform" type="scale" dur="8s" repeatCount="indefinite"
               values="1;1;0.82;0.82;1;1"
               keyTimes="0;0.145;0.235;0.82;0.92;1"/>
      <circle cx="0" cy="0" r="49" fill="url(#pinOuter)" stroke="#2f4556" stroke-width="6"/>
      <circle cx="0" cy="0" r="28" fill="url(#pinInner)" stroke="#526979" stroke-width="4"/>
      <circle cx="-10" cy="-12" r="8" fill="#ffffff" opacity="0.43"/>
    </g>
  </g>

  <!-- Left-side force components: rightward and upward -->
  <g id="leftForcesMove">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0 0;0 0;-150 0;-150 0;0 0;0 0"
      keyTimes="0;0.18;0.38;0.72;0.94;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <g transform="translate(600 320)" opacity="0" filter="url(#arrowGlow)">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1;0;0"
               keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      <line x1="25" y1="0" x2="140" y2="0" pathLength="1"
            stroke="#ef2b2d" stroke-width="10" stroke-linecap="round"
            marker-end="url(#forceArrow)" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
                 values="1;1;0;0;1;1"
                 keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      </line>
      <line x1="0" y1="-25" x2="0" y2="-140" pathLength="1"
            stroke="#ef2b2d" stroke-width="10" stroke-linecap="round"
            marker-end="url(#forceArrow)" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
                 values="1;1;0;0;1;1"
                 keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      </line>
    </g>
  </g>

  <!-- Right-side force components: leftward and downward -->
  <g id="rightForcesMove">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0 0;0 0;150 0;150 0;0 0;0 0"
      keyTimes="0;0.18;0.38;0.72;0.94;1"
      calcMode="spline"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <g transform="translate(600 320)" opacity="0" filter="url(#arrowGlow)">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1;0;0"
               keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      <line x1="-25" y1="0" x2="-140" y2="0" pathLength="1"
            stroke="#ef2b2d" stroke-width="10" stroke-linecap="round"
            marker-end="url(#forceArrow)" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
                 values="1;1;0;0;1;1"
                 keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      </line>
      <line x1="0" y1="25" x2="0" y2="140" pathLength="1"
            stroke="#ef2b2d" stroke-width="10" stroke-linecap="round"
            marker-end="url(#forceArrow)" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
                 values="1;1;0;0;1;1"
                 keyTimes="0;0.315;0.43;0.72;0.82;1"/>
      </line>
    </g>
  </g>
</svg>
